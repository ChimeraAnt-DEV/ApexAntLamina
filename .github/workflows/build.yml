name: Build Android preload mod (.so)

# Builds the ApexAntLamina preload-native mod for LeviLaunchroid /
# LeviLauncher on Android arm64-v8a. The artifact is a drop-in mod folder:
#
#   bin/ApexAntLamina/
#   ├── manifest.json
#   └── preload-levilamina.so
#
# Users copy the folder into the launcher's mods directory; the launcher
# reads `manifest.json` (type: preload-native, entry: preload-levilamina.so)
# and dlopens the .so through the preloader runtime.

on:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .github/workflows/build-apk.yml
      - src/**
      - src-server/**
      - src-client/**
      - src-pl-android/**
      - src-pl-export/**
      - xmake.lua
  push:
    paths:
      - .github/workflows/build.yml
      - src/**
      - src-server/**
      - src-client/**
      - src-pl-android/**
      - src-pl-export/**
      - xmake.lua
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/.xmake
          key: xmake-android-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-android-

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973
            platform-tools

      - name: Expose NDK path for xmake
        run: |
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - run: |
          xmake repo -u

      - name: Configure (android, arm64-v8a, server surface)
        run: |
          xmake f -p android -a arm64-v8a -m release -y --target_type=server

      - name: Build
        run: |
          xmake -v -y -P .

      - name: Repackage the preload-native mod for LeviLauncher
        run: |
          # The modpacker rule emits bin/ApexAntLamina/{manifest.json,libpreload-levilamina.so}.
          # LeviLauncher's manifest `entry` is `preload-levilamina.so`
          # (matching the packaged file name); drop the `lib` prefix here.
          if [ -f bin/ApexAntLamina/libpreload-levilamina.so ]; then
            mv bin/ApexAntLamina/libpreload-levilamina.so bin/ApexAntLamina/preload-levilamina.so
          fi
          python3 - <<'PY'
          import json, os, sys
          p = "bin/ApexAntLamina"
          if not os.path.isdir(p):
              print("mod dir not produced; listing tree")
              for root, dirs, files in os.walk("."):
                  for f in files:
                      if f.endswith(".so") or f == "manifest.json":
                          print(os.path.join(root, f))
              sys.exit(0)
          pth = os.path.join(p, "manifest.json")
          m = json.load(open(pth, encoding="utf-8"))
          if m.get("entry") == "libpreload-levilamina.so":
              m["entry"] = "preload-levilamina.so"
              json.dump(m, open(pth, "w", encoding="utf-8"), indent=2)
              print("manifest entry ->", m["entry"])
          PY

      - name: Smoke-test the artifact layout
        run: |
          test -f bin/ApexAntLamina/preload-levilamina.so
          test -f bin/ApexAntLamina/manifest.json
          python3 -c "import json;m=json.load(open('bin/ApexAntLamina/manifest.json'));assert m['entry']=='preload-levilamina.so';assert m['type']=='preload-native';print('OK', m)"

      - uses: actions/upload-artifact@v7
        with:
          name: apexantlamina-preload-android-arm64
          path: |
            bin/ApexAntLamina/
          if-no-files-found: error
