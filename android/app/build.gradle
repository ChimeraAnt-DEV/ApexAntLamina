apply plugin: "com.android.application"

android {
    namespace "org.levimc.launcher"
    compileSdk 34

    defaultConfig {
        applicationId "org.levimc.apexantlamina"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            // The preloader + ApexAntLamina preload mod are built for arm64.
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["../runtime-libs"]
        }
    }
}